name: Get Citation Data

on:
 page_build:
 workflow_dispatch:
 schedule:
  - cron:  '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run
      shell: bash
      run: |
        set -o pipefail
        cd ./google_scholar_crawler
        pip install -r requirements.txt 2>&1 | tee pip.log || { echo "::error title=pip failed::$(tail -n 5 pip.log | tr '\n' ' ')"; exit 1; }
        python main.py 2>&1 | tee run.log || { echo "::error title=Crawler failed::$(tail -n 5 run.log | tr '\n' ' ')"; exit 1; }
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: r3IEwrgAAAAJ
